name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :core:test :app:assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Report build errors as annotations
        if: failure()
        run: |
          grep -E "^e: |What went wrong|ERROR:|error:|FAILED|AssertionError|expected:" build.log | head -50 | while IFS= read -r line; do
            echo "::error::${line//$'\n'/ }"
          done
          grep -A6 "What went wrong" build.log | head -30 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk SlateNotes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SlateNotes-apk
          path: SlateNotes.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Slate Notes build ${{ github.run_number }}
          body: Built from ${{ github.sha }}. Download SlateNotes.apk below and open it on your phone to install or update.
          files: SlateNotes.apk
          make_latest: true
