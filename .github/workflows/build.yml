name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk SlateNotes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SlateNotes-apk
          path: SlateNotes.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Slate Notes build ${{ github.run_number }}
          body: Built from ${{ github.sha }}. Download SlateNotes.apk below and open it on your phone to install or update.
          files: SlateNotes.apk
          make_latest: true
